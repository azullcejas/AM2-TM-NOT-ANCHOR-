<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>overshare app</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #000000;
    color: #e7e9ea;
  }

  /* ---------- FEED SIMULADO (estilo tipo timeline de tweets) ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    border-bottom: 1px solid #2f3336;
    padding: 14px 20px; font-weight: 800; font-size: 18px;
  }
  .feed { max-width: 590px; margin: 0 auto; padding-bottom: 300px; }
  .post {
    display: flex; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid #2f3336;
  }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .post-main { flex: 1; min-width: 0; }
  .post-header { font-size: 14px; }
  .username { font-weight: 700; color: #e7e9ea; }
  .username span { font-weight: 400; color: #71767b; margin-left: 4px; }
  .post-body { font-size: 15px; line-height: 1.4; margin: 2px 0 8px; }
  .post-image { width: 100%; aspect-ratio: 16/9; border-radius: 14px; margin-bottom: 8px; }
  .post-actions {
    display: flex; gap: 32px; font-size: 13px; color: #71767b;
  }

  /* ---------- CAPA DEL MAR ---------- */
  #anchor-layer { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }

  #sea {
    position: fixed; inset: 0;
    background: #074c96;
    opacity: 0;
    mix-blend-mode: multiply;
    filter: blur(0px);
    transition: filter 0.3s linear;
  }

  #depth-marker {
    position: fixed; right: 16px; top: 16px;
    background: rgba(0,0,0,0.55); color: #fff;
    padding: 6px 10px; border-radius: 20px;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }

  /* alarma roja */
  #redlight {
    position: fixed; inset: 0;
    background: radial-gradient(circle, transparent 40%, rgba(200,0,0,0.55) 100%);
    opacity: 0;
  }
  #redlight.active {
    animation: alarm 0.9s infinite;
  }
  @keyframes alarm {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.75; }
  }

  /* ---------- LLUVIA DE JEROGLIFICOS ---------- */
  #glyph-rain { position: fixed; inset: 0; z-index: 900; pointer-events: none; overflow: hidden; }
  .glyph-drop { position: absolute; top: -60px; opacity: 0.9; animation: fall linear infinite; filter: brightness(0) invert(1) drop-shadow(0 0 4px rgba(255,255,255,0.5)); }
  @keyframes fall { from { transform: translateY(-10vh) rotate(0deg); } to { transform: translateY(110vh) rotate(25deg); } }

  /* ---------- LIKE ---------- */
  .like-btn { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 4px; }
  .like-btn .heart { display: inline-block; transition: transform 0.25s ease; }
  .like-btn.liked .heart { color: #f91880; animation: heartPop 0.35s ease; }
  @keyframes heartPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  /* ---------- POLVO CAYENDO (catacumbas) ---------- */
  #dust-layer { position: fixed; inset: 0; z-index: 950; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity 0.6s ease; }
  #dust-layer.active { opacity: 1; }
  .dust-particle { position: absolute; top: -20px; background: #8a7256; border-radius: 50%; animation: dustFall linear infinite; }
  @keyframes dustFall { from { transform: translateY(-5vh); } to { transform: translateY(105vh); } }

  #dust-fill {
    position: fixed; left: 0; right: 0; bottom: 0; height: 0;
    background: linear-gradient(to top, #6b5438 0%, rgba(107,84,56,0.5) 60%, transparent 100%);
    z-index: 940; pointer-events: none;
    transition: height 2.5s ease;
  }
  #dust-fill.active { height: 16vh; }

  /* ---------- CATACUMBAS: pala, sarcófago y guardianes ---------- */
  #catacumbs {
    position: fixed; left: 0; right: 0; bottom: 0; height: 42vh;
    background: #14100c;
    border-top: 5px solid #17130f;
    opacity: 0; transform: translateY(100%);
    transition: opacity 0.9s ease, transform 0.9s ease;
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden;
  }
  #catacumbs.active { opacity: 1; transform: translateY(0); }

  #sarcophagus { position: relative; width: 220px; margin-bottom: 18px; text-align: center; }
  #sarcophagus img {
    width: 100%; border-radius: 6px;
    opacity: 0; transform: scale(0.85) translateY(14px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    -webkit-mask-image: radial-gradient(ellipse at center, black 50%, transparent 88%);
    mask-image: radial-gradient(ellipse at center, black 50%, transparent 88%);
  }
  #catacumbs.opened #sarcophagus img { opacity: 1; transform: scale(1) translateY(0); }

  #guardians {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 44px; align-items: flex-end;
    opacity: 0; transition: opacity 0.6s ease;
  }
  #catacumbs.guardians-visible #guardians { opacity: 1; }
  .guardian { width: 46px; height: 78px; filter: saturate(6) brightness(1.4) hue-rotate(0deg); animation: glitchError 0.4s steps(2) infinite; }
  .guardian svg { width: 100%; height: 100%; }
  .guardian path, .guardian circle { fill: #ffffff; }
  @keyframes glitchError {
    0%   { filter: saturate(6) brightness(1.4) hue-rotate(0deg); }
    25%  { filter: saturate(8) brightness(1.8) hue-rotate(90deg); }
    50%  { filter: saturate(6) brightness(1.2) hue-rotate(200deg); }
    75%  { filter: saturate(9) brightness(1.6) hue-rotate(300deg); }
    100% { filter: saturate(6) brightness(1.4) hue-rotate(0deg); }
  }
  .guardian.left { animation: lungeLeft 0.7s ease-in-out infinite alternate; transform-origin: bottom center; }
  .guardian.center { animation: lungeCenter 0.6s ease-in-out infinite alternate; transform-origin: bottom center; }
  .guardian.right { animation: lungeRight 0.7s ease-in-out infinite alternate; transform-origin: bottom center; }
  @keyframes lungeLeft {
    from { transform: translateX(0) rotate(-6deg) scale(1); }
    to   { transform: translateX(14px) rotate(4deg) scale(1.08); }
  }
  @keyframes lungeCenter {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-10px) scale(1.1); }
  }
  @keyframes lungeRight {
    from { transform: translateX(0) rotate(6deg) scale(1) scaleX(-1); }
    to   { transform: translateX(-14px) rotate(-4deg) scale(1.08) scaleX(-1); }
  }

  #warning-img {
    position: absolute; top: 6%; left: 50%; transform: translate(-50%, -12px);
    width: min(70%, 320px);
    opacity: 0; transition: opacity 0.7s ease 0.2s;
    filter: drop-shadow(0 0 10px rgba(255,0,0,0.4));
  }
  #catacumbs.guardians-visible #warning-img { opacity: 1; }

  #fossil-label {
    position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 14px; text-align: center; white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 0.8s ease 0.4s;
  }
  #fossil-label.show { opacity: 1; }

  /* ---------- PORTAL DE ESCAPE: luz al fondo ---------- */
  #portal {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%);
    width: 240px; height: 130px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,225,140,0.55) 45%, transparent 75%);
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease, transform 1s ease;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px;
    cursor: pointer; z-index: 1001;
  }
  #portal.active {
    opacity: 1; transform: translate(-50%, 45%); pointer-events: auto;
    animation: pulseLight 2s ease-in-out infinite;
  }
  @keyframes pulseLight {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }
  #portal span {
    background: rgba(0,0,0,0.65); color: #fff; font-size: 12px;
    padding: 5px 10px; border-radius: 12px;
  }

  #transition-veil {
    position: fixed; inset: 0; z-index: 2000;
    background: #000; opacity: 0; pointer-events: none;
  }
</style>
</head>

    { cuenta: "@historia.viva", texto: "Un fragmento de cerámica es limpiado manualmente antes de su catalogación.", avatar: avatarUris[7] },
    { cuenta: "@patrimonio.hoy", texto: "Vista aérea de un yacimiento arqueológico en pleno proceso de excavación.", avatar: avatarUris[8] },
    { cuenta: "@excavando", texto: "Restos óseos vuelven a aparecer en otro sector del mismo yacimiento, según el informe preliminar.", avatar: avatarUris[9] },
    { cuenta: "@revista.arqueo", texto: "Un investigador documenta el hallazgo de restos óseos en el lugar del descubrimiento.", avatar: avatarUris[10] },
    { cuenta: "@historia.viva", texto: "Estructuras de piedra con miles de años de antigüedad, entre los vestigios arquitectónicos más antiguos conocidos.", avatar: avatarUris[11] },
    { cuenta: "@patrimonio.hoy", texto: "Columnas y bloques de piedra son todo lo que queda de una antigua edificación monumental.", avatar: avatarUris[12] },
    { cuenta: "@excavando", texto: "Un arqueólogo utiliza herramientas de precisión para liberar un hallazgo del sedimento que lo rodea.", avatar: avatarUris[13] },
    { cuenta: "@revista.arqueo", texto: "Un par de máscaras de terracota, restauradas tras su hallazgo, permiten reconstruir rasgos de una cultura antigua.", avatar: avatarUris[14] },
    { cuenta: "@historia.viva", texto: "En el laboratorio, distintos cráneos son analizados para reconstruir la historia de sus antiguos portadores.", avatar: avatarUris[15] },
    { cuenta: "@patrimonio.hoy", texto: "Colosales cabezas de piedra permanecen expuestas a la intemperie tras milenios de erosión.", avatar: avatarUris[16] },
  ];

  let likeCounter = 0;
  let archMode = false;

  function renderHumorPost(i){
    const c1 = colores[i % colores.length];
    const c2 = colores[(i+3) % colores.length];
    const t = tweets[i % tweets.length];
    const conImagen = i % 5 === 0;
    const imgHtml = t.cuenta === '@ihyjujuu' ? `<img class="post-image" src="${thanosImg}">`
      : (t.cuenta === '@cheeseburgersushi' ? `<img class="post-image" src="${warningImg}">`
      : (conImagen ? `<div class="post-image" style="background: linear-gradient(135deg, ${c2}, ${c1});"></div>` : ''));
    likeCounter++;
    return `
      <div class="post" data-type="humor">
        <div class="avatar" style="background: linear-gradient(135deg, ${c1}, ${c2});"></div>
        <div class="post-main">
          <div class="post-header">
            <span class="username">${t.cuenta}<span>· ${i+1}h</span></span>
          </div>
          <div class="post-body">${t.texto}</div>
          ${imgHtml}
          <div class="post-actions"><span>↻ ${(Math.random()*300).toFixed(0)}</span><span class="like-btn" data-id="${likeCounter}" data-type="humor"><span class="heart">♥</span> <span class="like-count">${(Math.random()*4000+50).toFixed(0)}</span></span><span>✉</span></div>
        </div>
      </div>`;
  }

  function renderArchPost(idx){
    const p = archPosts[idx % archPosts.length];
    likeCounter++;
    return `
      <div class="post" data-type="arch">
        <img class="avatar" src="${p.avatar}">
        <div class="post-main">
          <div class="post-header">
            <span class="username">${p.cuenta}<span>· ${idx+1}h</span></span>
          </div>
          <div class="post-body">${p.texto}</div>
          <div class="post-actions"><span>↻ ${(Math.random()*300).toFixed(0)}</span><span class="like-btn" data-id="${likeCounter}" data-type="arch"><span class="heart">♥</span> <span class="like-count">${(Math.random()*900+30).toFixed(0)}</span></span><span>✉</span></div>
        </div>
      </div>`;
  }

  // arma el feed: tweets normales, con datos arqueológicos apareciendo cada vez más seguido hacia el final
  let archUsed = 0;
  for (let i = 0; i < 14; i++){
    const archChance = i < 3 ? 0 : Math.min(0.15 + i * 0.06, 0.75);
    if (Math.random() < archChance){
      feed.innerHTML += renderArchPost(archUsed);
      archUsed++;
    } else {
      feed.innerHTML += renderHumorPost(i);
    }
  }

  // ---------- LIKES ----------
  function convertRestToArch(afterEl){
    let el = afterEl.nextElementSibling;
    while (el){
      const next = el.nextElementSibling;
      if (el.classList.contains('post') && el.dataset.type !== 'arch'){
        el.outerHTML = renderArchPost(archUsed % archPosts.length);
        archUsed++;
      }
      el = next;
    }
    // suma más posts arqueológicos al final para que siga bajando en modo arqueológico
    for (let k = 0; k < 6; k++){
      feed.innerHTML += renderArchPost(archUsed);
      archUsed++;
    }
  }

  function startGlyphRain(){
    if (document.body.classList.contains('rain-active')) return;
    document.body.classList.add('rain-active');
    const rainLayer = document.getElementById('glyph-rain');
    for (let i = 0; i < 40; i++){
      const drop = document.createElement('img');
      drop.src = glyphUris[Math.floor(Math.random()*glyphUris.length)];
      drop.className = 'glyph-drop';
      const size = 18 + Math.random()*22;
      drop.style.width = size + 'px';
      drop.style.left = (Math.random()*100) + 'vw';
      drop.style.animationDuration = (4 + Math.random()*6) + 's';
      drop.style.animationDelay = (-Math.random()*10) + 's';
      rainLayer.appendChild(drop);
    }
  }

  feed.addEventListener('click', (e) => {
    const btn = e.target.closest('.like-btn');
    if (!btn) return;
    const alreadyLiked = btn.classList.contains('liked');
    const countEl = btn.querySelector('.like-count');
    let count = parseInt(countEl.textContent, 10);
    if (alreadyLiked){
      btn.classList.remove('liked');
      countEl.textContent = Math.max(0, count - 1);
      return;
    }
    btn.classList.add('liked');
    countEl.textContent = count + 1;

    if (btn.dataset.type === 'arch' && !archMode){
      archMode = true;
      const post = btn.closest('.post');
      convertRestToArch(post);
    }
  });

  const sea = document.getElementById('sea');
  const redlight = document.getElementById('redlight');
  const catacumbs = document.getElementById('catacumbs');
  const fossilLabel = document.getElementById('fossil-label');
  const portal = document.getElementById('portal');
  const marker = document.getElementById('depth-marker');
  const dustLayer = document.getElementById('dust-layer');
  const dustFill = document.getElementById('dust-fill');

  let opened = false;
  let guardiansShown = false;
  let dustSpawned = false;
  let shakeRaf = null;
  let shakeIntensity = 0;

  function shakeLoop(){
    if (shakeIntensity > 0){
      const dx = (Math.random()-0.5) * shakeIntensity;
      const dy = (Math.random()-0.5) * shakeIntensity;
      document.body.style.transform = `translate(${dx}px, ${dy}px)`;
    } else {
      document.body.style.transform = 'none';
    }
    shakeRaf = requestAnimationFrame(shakeLoop);
  }
  shakeLoop();

  function spawnDust(){
    for (let i = 0; i < 35; i++){
      const d = document.createElement('div');
      d.className = 'dust-particle';
      const size = 3 + Math.random()*6;
      d.style.width = size + 'px';
      d.style.height = size + 'px';
      d.style.left = (Math.random()*100) + 'vw';
      d.style.opacity = 0.4 + Math.random()*0.5;
      d.style.animationDuration = (2 + Math.random()*3) + 's';
      d.style.animationDelay = (-Math.random()*4) + 's';
      dustLayer.appendChild(d);
    }
  }

  // colores del agua en saltos bruscos (sin degradé suave)
  function waterColorFor(progress){
    if (progress < 0.25) return { color: '#074c96', opacity: 0.3, blur: 0 };
    if (progress < 0.5)  return { color: '#0f6b3d', opacity: 0.55, blur: 3 };
    if (progress < 0.72) return { color: '#7a1f1f', opacity: 0.65, blur: 5 };
    if (progress < 0.9)  return { color: '#4a0e0e', opacity: 0.8, blur: 7 };
    return { color: '#210505', opacity: 0.9, blur: 9 };
  }

  function updateScene(){
    const scrollTop = window.scrollY;
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    const progress = Math.min(Math.max(scrollTop / maxScroll, 0), 1);

    const w = waterColorFor(progress);
    sea.style.background = w.color;
    sea.style.opacity = w.opacity;
    sea.style.filter = `blur(${w.blur}px)`;

    marker.textContent = (progress * 40).toFixed(1) + 'm';

    // temblor: aumenta cuanto más bajás, más fuerte todavía en las catacumbas
    if (progress > 0.3){
      const base = Math.min((progress - 0.3) / 0.7, 1) * 9;
      shakeIntensity = progress > 0.8 ? base + 6 : base;
    } else {
      shakeIntensity = 0;
    }

    if (progress > 0.8){
      catacumbs.classList.add('active');
      dustLayer.classList.add('active');
      dustFill.classList.add('active');
      if (!dustSpawned){ dustSpawned = true; spawnDust(); }
      if (progress > 0.88 && !opened){
        opened = true;
        catacumbs.classList.add('opened');
      }
      if (progress > 0.93 && !guardiansShown){
        guardiansShown = true;
        catacumbs.classList.add('guardians-visible');
        fossilLabel.classList.add('show');
        redlight.classList.add('active');
      }
    } else {
      catacumbs.classList.remove('active', 'opened', 'guardians-visible');
      dustLayer.classList.remove('active');
      dustFill.classList.remove('active');
      fossilLabel.classList.remove('show');
      redlight.classList.remove('active');
      opened = false;
      guardiansShown = false;
      dustSpawned = false;
      dustLayer.innerHTML = '';
    }

    if (progress > 0.985){
      portal.classList.add('active');
    } else {
      portal.classList.remove('active');
    }
  }

  startGlyphRain();

  const transitionVeil = document.getElementById('transition-veil');
  portal.addEventListener('click', () => {
    transitionVeil.style.transition = 'opacity 0.3s ease';
    transitionVeil.style.opacity = '1';
    setTimeout(() => {
      window.scrollTo(0, 0);
      updateScene();
    }, 300);
    setTimeout(() => {
      transitionVeil.style.transition = 'opacity 1.2s ease';
      transitionVeil.style.opacity = '0';
    }, 3000);
  });

  window.addEventListener('scroll', updateScene);
  window.addEventListener('resize', updateScene);
  updateScene();
</script>
</body>
</html>
