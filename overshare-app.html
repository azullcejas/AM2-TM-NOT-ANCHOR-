<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>overshare app</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    background: #000000;
    color: #e7e9ea;
  }

  /* ---------- FEED SIMULADO (estilo tipo timeline de tweets) ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
    border-bottom: 1px solid #2f3336;
    padding: 14px 20px; font-weight: 800; font-size: 18px;
  }
  .feed { max-width: 590px; margin: 0 auto; padding-bottom: 300px; }
  .post {
    display: flex; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid #2f3336;
  }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; }
  .post-main { flex: 1; min-width: 0; }
  .post-header { font-size: 14px; }
  .username { font-weight: 700; color: #e7e9ea; }
  .username span { font-weight: 400; color: #71767b; margin-left: 4px; }
  .post-body { font-size: 15px; line-height: 1.4; margin: 2px 0 8px; }
  .post-image { width: 100%; aspect-ratio: 16/9; border-radius: 14px; margin-bottom: 8px; }
  .post-actions {
    display: flex; gap: 32px; font-size: 13px; color: #71767b;
  }

  /* ---------- CAPA DEL MAR ---------- */
  #anchor-layer { position: fixed; inset: 0; z-index: 1000; pointer-events: none; }

  #sea {
    position: fixed; inset: 0;
    background: #074c96;
    opacity: 0;
    mix-blend-mode: multiply;
    filter: blur(0px);
    transition: filter 0.3s linear;
  }

  #depth-marker {
    position: fixed; right: 16px; top: 16px;
    background: rgba(0,0,0,0.55); color: #fff;
    padding: 6px 10px; border-radius: 20px;
    font-size: 12px; font-variant-numeric: tabular-nums;
  }

  /* alarma roja */
  #redlight {
    position: fixed; inset: 0;
    background: radial-gradient(circle, transparent 40%, rgba(200,0,0,0.55) 100%);
    opacity: 0;
  }
  #redlight.active {
    animation: alarm 0.9s infinite;
  }
  @keyframes alarm {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.75; }
  }

  /* ---------- PECES ---------- */
  #creatures { position: absolute; top: 0; left: 0; width: 100%; z-index: 500; pointer-events: none; }
  .fish { position: absolute; font-size: 30px; }
  .fish.dir-right { animation-name: swimRight; animation-timing-function: linear; animation-iteration-count: infinite; }
  .fish.dir-left { animation-name: swimLeft; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes swimRight { from { transform: translateX(-10vw); } to { transform: translateX(110vw); } }
  @keyframes swimLeft { from { transform: translateX(110vw) scaleX(-1); } to { transform: translateX(-10vw) scaleX(-1); } }

  /* ---------- CATACUMBAS: pala, sarcófago y guardianes ---------- */
  #catacumbs {
    position: fixed; left: 0; right: 0; bottom: 0; height: 42vh;
    background:
      repeating-linear-gradient(45deg, #3a332b, #3a332b 10px, #2b251f 10px, #2b251f 20px);
    border-top: 5px solid #17130f;
    opacity: 0; transform: translateY(100%);
    transition: opacity 0.9s ease, transform 0.9s ease;
    display: flex; align-items: flex-end; justify-content: center;
    overflow: hidden;
  }
  #catacumbs.active { opacity: 1; transform: translateY(0); }

  #shovel {
    position: absolute; top: 8%; left: 50%; transform: translateX(-50%);
    font-size: 44px;
    animation: dig 0.6s ease-in-out infinite;
  }
  @keyframes dig {
    0%, 100% { transform: translateX(-50%) rotate(-15deg); }
    50% { transform: translateX(-50%) rotate(10deg) translateY(6px); }
  }

  #sarcophagus { position: relative; width: 220px; margin-bottom: 18px; text-align: center; }
  #sarcophagus img {
    width: 100%; border-radius: 6px;
    opacity: 0; transform: scale(0.85) translateY(14px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  #catacumbs.opened #sarcophagus img { opacity: 1; transform: scale(1) translateY(0); }

  #guardians {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 44px; align-items: flex-end;
    opacity: 0; transition: opacity 0.6s ease;
  }
  #catacumbs.guardians-visible #guardians { opacity: 1; }
  .guardian { width: 46px; height: 78px; }
  .guardian svg { width: 100%; height: 100%; }
  .guardian path, .guardian circle { fill: #0d0d0d; }
  .guardian.left { animation: lungeLeft 0.7s ease-in-out infinite alternate; transform-origin: bottom center; }
  .guardian.center { animation: lungeCenter 0.6s ease-in-out infinite alternate; transform-origin: bottom center; }
  .guardian.right { animation: lungeRight 0.7s ease-in-out infinite alternate; transform-origin: bottom center; }
  @keyframes lungeLeft {
    from { transform: translateX(0) rotate(-6deg) scale(1); }
    to   { transform: translateX(14px) rotate(4deg) scale(1.08); }
  }
  @keyframes lungeCenter {
    from { transform: translateY(0) scale(1); }
    to   { transform: translateY(-10px) scale(1.1); }
  }
  @keyframes lungeRight {
    from { transform: translateX(0) rotate(6deg) scale(1) scaleX(-1); }
    to   { transform: translateX(-14px) rotate(-4deg) scale(1.08) scaleX(-1); }
  }

  #warning-img {
    position: absolute; top: 6%; left: 50%; transform: translate(-50%, -12px);
    width: min(70%, 320px);
    opacity: 0; transition: opacity 0.7s ease 0.2s;
    filter: drop-shadow(0 0 10px rgba(255,0,0,0.4));
  }
  #catacumbs.guardians-visible #warning-img { opacity: 1; }

  #fossil-label {
    position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 14px; text-align: center; white-space: nowrap;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 0.8s ease 0.4s;
  }
  #fossil-label.show { opacity: 1; }

  /* ---------- PORTAL DE ESCAPE: luz al fondo ---------- */
  #portal {
    position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%);
    width: 240px; height: 130px;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,225,140,0.55) 45%, transparent 75%);
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease, transform 1s ease;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px;
    cursor: pointer; z-index: 1001;
  }
  #portal.active {
    opacity: 1; transform: translate(-50%, 45%); pointer-events: auto;
    animation: pulseLight 2s ease-in-out infinite;
  }
  @keyframes pulseLight {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }
  #portal span {
    background: rgba(0,0,0,0.65); color: #fff; font-size: 12px;
    padding: 5px 10px; border-radius: 12px;
  }
</style>

          </div>
          <div class="post-body">${t.texto}</div>
          ${t.cuenta === '@ihyjujuu' ? `<img class="post-image" src="${thanosImg}">` : (t.cuenta === '@cheeseburgersushi' ? `<img class="post-image" src="${warningImg}">` : (conImagen ? `<div class="post-image" style="background: linear-gradient(135deg, ${c2}, ${c1});"></div>` : ''))}
          <div class="post-actions"><span>↻ ${(Math.random()*300).toFixed(0)}</span><span>♥ ${(Math.random()*4000+50).toFixed(0)}</span><span>✉</span></div>
        </div>
      </div>`;
    if (t.reply){
      feed.innerHTML += `
      <div class="post" style="padding-left: 40px;">
        <div class="avatar" style="width:32px;height:32px;background: linear-gradient(135deg, ${c2}, ${c1});"></div>
        <div class="post-main">
          <div class="post-header">
            <span class="username">@triplet<span>· ${i+1}h</span></span>
          </div>
          <div class="post-body">${t.reply}</div>
          <div class="post-actions"><span>↻ ${(Math.random()*50).toFixed(0)}</span><span>♥ ${(Math.random()*500+20).toFixed(0)}</span><span>✉</span></div>
        </div>
      </div>`;
    }
  }

  const sea = document.getElementById('sea');
  const redlight = document.getElementById('redlight');
  const catacumbs = document.getElementById('catacumbs');
  const fossilLabel = document.getElementById('fossil-label');
  const portal = document.getElementById('portal');
  const marker = document.getElementById('depth-marker');
  const creaturesLayer = document.getElementById('creatures');

  // Genera peces distribuidos a lo largo de todo el documento
  const docHeight = document.body.scrollHeight;
  const especies = ['🐟', '🐠', '🐡'];
  for (let i = 0; i < 22; i++){
    const depthFraction = 0.15 + Math.random() * 0.8; // dónde aparece en la página
    const top = depthFraction * docHeight;
    const dir = Math.random() > 0.5 ? 'dir-right' : 'dir-left';
    const duration = 8 + Math.random() * 10;
    const delay = Math.random() * 8;
    const especie = especies[Math.floor(Math.random() * especies.length)];
    const opacity = 1 - depthFraction * 0.5; // más profundo, más tenue (agua turbia)
    const blur = depthFraction * 2.5;
    const el = document.createElement('div');
    el.className = `fish ${dir}`;
    el.textContent = especie;
    el.style.top = top + 'px';
    el.style.left = '0';
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = '-' + delay + 's';
    el.style.opacity = opacity;
    el.style.filter = `blur(${blur}px)`;
    creaturesLayer.appendChild(el);
  }

  let opened = false;
  let guardiansShown = false;

  function lerpColor(hexA, hexB, t){
    const a = hexA.match(/\w\w/g).map(x=>parseInt(x,16));
    const b = hexB.match(/\w\w/g).map(x=>parseInt(x,16));
    const c = a.map((v,i)=> Math.round(v + (b[i]-v)*t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function updateScene(){
    const scrollTop = window.scrollY;
    const maxScroll = document.body.scrollHeight - window.innerHeight;
    const progress = Math.min(Math.max(scrollTop / maxScroll, 0), 1);

    // color del agua: azul calmo -> verde turbio -> rojo tenso
    let color, opacity, blur;
    if (progress < 0.45){
      const t = progress / 0.45;
      color = lerpColor('074c96', '1e5c3a', t);
      opacity = 0.15 + t * 0.25;
      blur = t * 3;
    } else if (progress < 0.8){
      const t = (progress - 0.45) / 0.35;
      color = lerpColor('1e5c3a', '5c1e2e', t);
      opacity = 0.4 + t * 0.3;
      blur = 3 + t * 4;
    } else {
      const t = (progress - 0.8) / 0.2;
      color = lerpColor('5c1e2e', '3a0a0a', t);
      opacity = 0.7 + t * 0.2;
      blur = 7 + t * 3;
    }
    sea.style.background = color;
    sea.style.opacity = opacity;
    sea.style.filter = `blur(${blur}px)`;

    // profundidad simulada en metros (ficticia, sube con el scroll)
    marker.textContent = (progress * 40).toFixed(1) + 'm';

    // catacumbas: aparecen, se abre el sarcófago y salen los guardianes
    if (progress > 0.8){
      catacumbs.classList.add('active');
      if (progress > 0.88 && !opened){
        opened = true;
        catacumbs.classList.add('opened');
      }
      if (progress > 0.93 && !guardiansShown){
        guardiansShown = true;
        catacumbs.classList.add('guardians-visible');
        fossilLabel.classList.add('show');
        redlight.classList.add('active');
      }
    } else {
      catacumbs.classList.remove('active', 'opened', 'guardians-visible');
      fossilLabel.classList.remove('show');
      redlight.classList.remove('active');
      opened = false;
      guardiansShown = false;
    }

    // portal-luz al llegar al fondo, para escapar de los guardianes
    if (progress > 0.985){
      portal.classList.add('active');
    } else {
      portal.classList.remove('active');
    }
  }

  portal.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  window.addEventListener('scroll', updateScene);
  window.addEventListener('resize', updateScene);
  updateScene();
</script>
</body>
</html>
